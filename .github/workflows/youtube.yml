name: Sync YouTube films
on:
  schedule:
    - cron: '17 20 * * *'   # every day, about 6am Melbourne time
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/youtube-sync.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- portfolio/videos.json; then echo "Nothing new"; exit 0; fi
          git config user.name "krnbry-bot"
          git config user.email "actions@users.noreply.github.com"
          git add portfolio/videos.json
          git commit -m "Update films from YouTube"
          git push
